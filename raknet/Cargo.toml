[package]
name = "raknet"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["OmniacDev"]

[dependencies]
byteorder = "1.5.0"
rand = "0.10"
tracing = "0.1.44"
thiserror = "2"
facet = { version = "0.46", features = ["net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
facet-json = "0.46"
